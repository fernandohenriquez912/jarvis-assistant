<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b18">
<title>JARVIS - Asistente personal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 35%, #10294a, #050b18 70%);
  color: #e8f5ff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 15px;
  border-bottom: 1px solid #17466b;
}

header h1 {
  color: #56caff;
  letter-spacing: 7px;
  font-size: 30px;
  margin: 8px;
}

.status {
  color: #54e5b2;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  max-width: 500px;
  margin: auto;
  padding: 25px 18px;
  text-align: center;
}

.clock {
  font-size: 35px;
  color: #8adfff;
  margin-top: 12px;
}

.date {
  color: #8daac5;
  margin: 8px;
  font-size: 13px;
}

.reactor {
  width: 175px;
  height: 175px;
  border-radius: 50%;
  margin: 35px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #43bfff;
  box-shadow: 0 0 20px #168bdb, inset 0 0 25px #168bdb;
  animation: pulse 3s infinite;
}

.reactor span {
  font-size: 48px;
  color: #8ce5ff;
  text-shadow: 0 0 20px #37baff;
}

@keyframes pulse {
  50% { box-shadow: 0 0 40px #168bdb, inset 0 0 35px #168bdb; }
}

h2 {
  font-size: 19px;
  color: #73d7ff;
}

.subtitle {
  color: #91a9c2;
  font-size: 13px;
}

.panel {
  background: #0b1930;
  border: 1px solid #17466b;
  border-radius: 15px;
  padding: 18px;
  margin-top: 25px;
  text-align: left;
}

#chat {
  height: 150px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 14px;
  background: #071225;
  border: 1px solid #23618c;
  border-radius: 9px;
  color: white;
  font-size: 14px;
  outline: none;
}

button {
  background: #087db8;
  color: white;
  border: 1px solid #48c7ff;
  padding: 13px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
}

button:active { background: #07547d; }

.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.controls button { flex: 1; }

#send { margin-top: 10px; width: 100%; }

footer {
  text-align: center;
  color: #58758e;
  font-size: 11px;
  padding: 30px 10px;
}
</style>
</head>

<body>

<header>
  <div class="status">● SISTEMA EN LÍNEA</div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">ASISTENTE PERSONAL</div>
</header>

<main>

  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date"></div>

  <div class="reactor">
    <span>✧</span>
  </div>

  <h2>Buenos días, señor.</h2>
  <p class="subtitle">Todos los sistemas están preparados.</p>

  <div class="panel">
    <h2>Terminal de comunicación</h2>
    <div id="chat">
      <div><b>JARVIS:</b> Buenas tardes, señor. Estoy a su disposición. ¿En qué puedo ayudarle?</div>
    </div>

    <input id="message" placeholder="Escriba un mensaje...">

    <button id="send" onclick="sendMessage()">Enviar mensaje</button>

    <div class="controls">
      <button onclick="listen()">🎙 Hablar</button>
      <button onclick="speakLast()">🔊 Repetir</button>
    </div>
  </div>

</main>

<footer>
  JARVIS PERSONAL SYSTEM · VERSIÓN 0.1
</footer>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("es-CL");

  document.getElementById("date").textContent =
    now.toLocaleDateString("es-CL", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

setInterval(updateClock, 1000);
updateClock();

let lastResponse = "";

function addMessage(who, message) {
  const chat = document.getElementById("chat");
  const line = document.createElement("div");
  const bold = document.createElement("b");

  bold.textContent = who + ": ";
  line.appendChild(bold);
  line.appendChild(document.createTextNode(message));

  chat.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

function respond(message) {
  const text = message.toLowerCase();
  let answer;

  if (text.includes("hola")) {
    answer = "Buenos días, señor. Es un placer asistirle.";
  } else if (text.includes("cómo estás")) {
    answer = "Todos mis sistemas funcionan correctamente.";
  } else if (text.includes("hora")) {
    answer = "La hora actual es " +
      new Date().toLocaleTimeString("es-CL");
  } else if (text.includes("tu nombre")) {
    answer = "Mi nombre es JARVIS. Su asistente personal.";
  } else if (text.includes("gracias")) {
    answer = "Siempre a su servicio, señor.";
  } else if (text.includes("ayuda")) {
    answer = "Por ahora puedo responder a saludos, consultar la hora y conversar mediante comandos básicos.";
  } else {
    answer = "He recibido su mensaje, señor. Mi sistema de inteligencia avanzada todavía está en desarrollo.";
  }

  lastResponse = answer;
  addMessage("JARVIS", answer);
  speak(answer);
}

function sendMessage() {
  const input = document.getElementById("message");
  const message = input.value.trim();

  if (!message) return;

  addMessage("SEÑOR", message);
  input.value = "";
  respond(message);
}

document.getElementById("message")
.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "es-ES";
  voice.rate = 0.92;
  voice.pitch = 0.85;

  window.speechSynthesis.speak(voice);
}

function speakLast() {
  if (lastResponse) speak(lastResponse);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage("JARVIS", "El reconocimiento de voz no está disponible en este navegador. Puede escribirme.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "es-ES";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const message = event.results[0][0].transcript;
    document.getElementById("message").value = message;
    sendMessage();
  };

  recognition.onerror = function() {
    addMessage("JARVIS", "No pude reconocer su voz. Puede intentarlo nuevamente.");
  };

  recognition.start();
}
</script>

</body>
  </html>
